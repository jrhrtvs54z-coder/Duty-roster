<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alert Duty Roster</title>
<meta name="description" content="Alert duty roster for the squadron scheduler. Everything stays on this phone.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Duty Roster">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141B19">
<meta name="format-detection" content="telephone=no">
<meta name="app-version" content="1.0.0">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,600;75,800&family=Atkinson+Hyperlegible:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
<style>
:root{
  /* Layout: an ops board. One sheet per shift day, callsigns on name tags,
     and a 24-hour strip that runs from shift change to shift change. */
  --bg:#ECEFED;--sheet:#FFFFFF;--sheet-2:#F5F7F6;--ink:#111917;--muted:#55635E;--line:#D5DBD8;--line-2:#B3BDB9;
  --accent:#1C48C2;--accent-ink:#FFFFFF;--accent-soft:#E4EAFB;
  --tag:#FFFFFF;--tag-line:#B9C3BF;--tag-ink:#1B3DA3;--tag-shadow:rgba(17,25,23,.10);
  --night:#DFE4F4;--night-ink:#2F3F78;
  --warn:#8C5200;--warn-soft:#FFEDCC;--bad:#B02020;--bad-soft:#FBE3E1;--ok:#1D6B40;--ok-soft:#DCF0E3;
  --callout:#FFF1A3;--callout-ink:#4A3800;--callout-line:#E2CB52;
  --away:#E7EBE9;--away-ink:#5B6863;--scrim:rgba(10,16,14,.45);
  --f-display:"Archivo","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"B612 Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1110;--sheet:#141B19;--sheet-2:#18201E;--ink:#E3EAE7;--muted:#97A5A0;--line:#27312E;--line-2:#3B4743;
  --accent:#8AA8FF;--accent-ink:#0A1022;--accent-soft:#1B2647;
  --tag:#1A2321;--tag-line:#36433F;--tag-ink:#B1C5FF;--tag-shadow:rgba(0,0,0,.45);
  --night:#1B2242;--night-ink:#B8C2EE;
  --warn:#F0B657;--warn-soft:#3A2B0F;--bad:#FF928A;--bad-soft:#3F1816;--ok:#7ED6A2;--ok-soft:#10301F;
  --callout:#38310F;--callout-ink:#F2E29A;--callout-line:#6B5C1A;
  --away:#1E2624;--away-ink:#95A29D;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1110;--sheet:#141B19;--sheet-2:#18201E;--ink:#E3EAE7;--muted:#97A5A0;--line:#27312E;--line-2:#3B4743;
  --accent:#8AA8FF;--accent-ink:#0A1022;--accent-soft:#1B2647;
  --tag:#1A2321;--tag-line:#36433F;--tag-ink:#B1C5FF;--tag-shadow:rgba(0,0,0,.45);
  --night:#1B2242;--night-ink:#B8C2EE;
  --warn:#F0B657;--warn-soft:#3A2B0F;--bad:#FF928A;--bad-soft:#3F1816;--ok:#7ED6A2;--ok-soft:#10301F;
  --callout:#38310F;--callout-ink:#F2E29A;--callout-line:#6B5C1A;
  --away:#1E2624;--away-ink:#95A29D;--scrim:rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.disp{font-family:var(--f-display);font-stretch:75%;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.mono{font-family:var(--f-mono)}
.eyebrow{font:700 12px/1.2 var(--f-display);font-stretch:75%;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
.brand-name{font-size:21px;line-height:1;white-space:nowrap}
.brand-sub{font:700 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.save{font:700 12px/1 var(--f-ui);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.save-saved::before,.save-local::before{background:var(--ok)}
.save-saving::before{background:var(--warn)}
.save-error{color:var(--bad)}.save-error::before{background:var(--bad)}
.save-ro::before{background:var(--muted)}
.tabs{display:flex;gap:4px;padding-block:6px 0;overflow-x:auto;scrollbar-width:none}
.tab{flex:0 0 auto;padding:9px 14px 10px;font:700 14px/1 var(--f-ui);color:var(--muted);text-decoration:none;border-bottom:3px solid transparent}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:18px 96px;display:flex;flex-direction:column;gap:18px}
.col{max-width:660px;width:100%;display:flex;flex-direction:column;gap:18px}

/* generic */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:6px;border:1px solid var(--line-2);background:var(--sheet);color:var(--ink);font:700 14px/1 var(--f-ui);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{border-color:var(--accent);filter:brightness(1.08)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--accent);padding:0 8px}
.btn-quiet:hover{border-color:transparent;text-decoration:underline}
.btn-danger{color:var(--bad)}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.is-on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.icon{width:18px;height:18px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.note{font-size:13px;color:var(--muted);margin:0}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);font-size:14px}
.banner-ex{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.banner-bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.issues{list-style:none;margin:0;padding:12px 14px;border-radius:8px;background:var(--bad-soft);display:flex;flex-direction:column;gap:6px;font-size:14px}
.issues li{display:flex;gap:8px}
.issues li::before{content:"";flex:none;width:8px;height:8px;margin-top:6px;border-radius:2px;background:var(--bad)}
.issues li.w::before{background:var(--warn)}
.issues li.fix::before{display:none}
.flag{display:inline-flex;align-items:center;padding:3px 6px;border-radius:3px;font:700 11px/1 var(--f-mono);letter-spacing:.03em}
.flag-warn{background:var(--warn-soft);color:var(--warn)}
.flag-bad{background:var(--bad-soft);color:var(--bad)}
.flag-ok{background:var(--ok-soft);color:var(--ok)}
.flag-mute{background:var(--away);color:var(--away-ink)}

/* name tags */
.tag{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 9px;border:1px solid var(--tag-line);border-radius:4px;background:var(--tag);color:var(--tag-ink);font:700 13px/1 var(--f-mono);letter-spacing:.02em;text-transform:uppercase;box-shadow:0 1px 0 var(--tag-shadow);white-space:nowrap;max-width:100%}
button.tag{cursor:pointer}
button.tag:hover{border-color:var(--tag-ink)}
.tag small{font:700 10px/1 var(--f-mono);color:var(--warn)}
.tag.dbl{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.tag.tri{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.tag.tri small{color:var(--bad)}
.tag.empty{border-style:dashed;color:var(--bad);background:transparent;box-shadow:none}
.tag.bad{outline:2px solid var(--bad);outline-offset:1px}
.tag-sm{min-height:26px;font-size:12px;padding:0 7px}
.tag.off{color:var(--ink)}
.tag.away{background:var(--away);color:var(--away-ink);border-color:transparent;box-shadow:none}
.tag.rest{background:var(--ok-soft);color:var(--ok);border-color:transparent;box-shadow:none}
.tag.rest small{color:var(--ok)}
.tag.rest.kept{border-color:var(--ok)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* day header */
.dayhead{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.dayhead h1{margin:0;font-size:34px;line-height:.95}
.dayhead .sub{margin:4px 0 0;font-size:14px;color:var(--muted)}
.navbtn{width:44px;height:44px;padding:0;border-radius:50%}
.nowlink{font-size:14px;font-weight:700}

/* watch bill */
.bill{overflow:hidden}
.bill-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--sheet-2);border-bottom:1px solid var(--line)}
.bill-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;grid-template-areas:"n pair time" ". meta meta";column-gap:10px;row-gap:7px;padding:12px 14px;align-items:center}
.bill-row+.bill-row{border-top:1px solid var(--line)}
.bill-n{grid-area:n;font-size:26px;line-height:1;color:var(--muted)}
.bill-pair{grid-area:pair;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.bill-time{grid-area:time;text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.bill-time b{font:700 15px/1 var(--f-mono);letter-spacing:.01em}
.bill-time span{font-size:12px;color:var(--muted)}
.bill-meta{grid-area:meta;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.bill-meta b{color:var(--ink);font-weight:700}
.bill-row.is-night .bill-time b{color:var(--night-ink)}
.bday{display:flex;flex-direction:column;gap:12px;padding:18px 16px;border-radius:8px;border:1px dashed var(--line-2);background:repeating-linear-gradient(135deg,var(--sheet) 0 10px,var(--sheet-2) 10px 20px)}
.bday p{margin:0}
.bill-meta .lv+.lv{margin-left:4px}
.lv{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;margin:-2px 0;border:1px solid var(--line-2);border-radius:4px;background:var(--sheet);color:var(--ink);font:700 13px/1.2 var(--f-mono);cursor:pointer}
.lv:hover{border-color:var(--ink)}
.lv.early{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.mx thead th.swap b{text-decoration:underline dotted;text-underline-offset:3px}
.pl{display:grid;grid-template-columns:22px minmax(0,1fr) 78px;gap:8px 10px;align-items:center;padding:10px 14px}
.pl-n{font:700 12px/1 var(--f-mono);color:var(--muted);text-align:right}
.pl+.pl,.pl+.li{border-top:1px solid var(--line)}
.pl-opts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.pl-opts .btn{margin-left:auto}
@media (min-width:700px){.pl{grid-template-columns:22px minmax(0,200px) 78px minmax(0,1fr)}.pl-opts{grid-column:auto}}
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ord-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto 44px;align-items:center;gap:6px;height:50px;padding:0 0 0 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);position:relative}
.ord-n{font:700 12px/1 var(--f-mono);color:var(--muted)}
.ord-cs{font:700 14px/1.2 var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord-b{width:40px;padding:0}
.ord-h{display:grid;place-items:center;align-self:stretch;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-left:1px solid var(--line)}
.ord-h:hover{color:var(--ink)}
.ord-row.drag{z-index:2;border-color:var(--ink);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.ord-row.drag .ord-h{cursor:grabbing}
.ord.dragging .ord-row{transition:transform .12s ease-out}
.ord.dragging .ord-row.drag{transition:none}
@media (prefers-reduced-motion:reduce){.ord.dragging .ord-row{transition:none}}
.role{font:700 10px/1 var(--f-mono);letter-spacing:.04em;color:var(--muted);border:1px solid var(--line-2);border-radius:3px;padding:2px 4px;vertical-align:1px}
.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tg{display:flex;flex-direction:column;gap:8px;min-width:0}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.rrow-act{grid-column:1 / -1;gap:6px}
.mx th.oth,.mx td.oth{background:repeating-linear-gradient(135deg,var(--sheet) 0 4px,var(--sheet-2) 4px 8px)}
.tg-rest .section{gap:8px}
.callout{padding:12px 14px;border:1px solid var(--callout-line);background:var(--callout);color:var(--callout-ink);border-radius:6px;font:700 14px/1.35 var(--f-ui);display:flex;flex-direction:column;gap:2px}

/* 24h strip */
.strip{margin:0;display:flex;flex-direction:column;gap:6px}
.strip-plot{position:relative;padding-block:4px}
.strip-night{position:absolute;top:0;bottom:0;background:var(--night);border-radius:3px}
.strip-night span{position:absolute;top:-1px;right:4px;font:700 9px/1.6 var(--f-mono);color:var(--night-ink);letter-spacing:.08em}
.strip-rep{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line-2)}
.strip-rows{position:relative;display:flex;flex-direction:column;gap:4px}
.strip-row{position:relative;height:22px}
.strip-bar{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:5px;padding:0 6px;border-radius:3px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--tag-ink);font:700 10.5px/1 var(--f-mono);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.strip-bar.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.strip-cap{font:700 9.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.strip-at{position:relative;height:20px;margin-top:3px}
.strip-at span{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 6px;background:var(--ok-soft);color:var(--ok);font:700 10.5px/1 var(--f-mono);border-left:2px solid var(--sheet);white-space:nowrap;overflow:hidden}
.strip-at span.bad{background:var(--bad-soft);color:var(--bad)}
.strip-ticks{position:relative;height:14px;font:400 10px/14px var(--f-mono);color:var(--muted)}
.strip-ticks span{position:absolute;top:0;transform:translateX(-50%)}
.strip-ticks span.l{transform:none}.strip-ticks span.r{transform:translateX(-100%)}

/* month matrix */
.monthhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthhead h1{margin:0;font-size:30px;line-height:1}
.gen{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font:700 12px/1.2 var(--f-display);font-stretch:75%;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{min-height:40px;padding:0 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--sheet);color:var(--ink);font:700 14px/1 var(--f-ui);min-width:0}
.inp.mono{font-family:var(--f-mono);letter-spacing:.04em}
.inp-time{width:72px;text-align:center}
.inp[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-soft)}
textarea.inp{padding:10px;min-height:120px;line-height:1.5;font-weight:400;resize:vertical;width:100%}
.mx-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.mx{border-collapse:separate;border-spacing:0;font:700 12px/1 var(--f-mono)}
.mx th,.mx td{width:30px;min-width:30px;height:30px;padding:0;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.mx tbody tr:last-child th,.mx tbody tr:last-child td{border-bottom:0}
.mx .mx-name{position:sticky;left:0;z-index:1;background:var(--sheet);text-align:left;padding:0 10px;min-width:98px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 12px/1 var(--f-mono);box-shadow:1px 0 0 var(--line)}
.mx thead th{height:40px;font-weight:400;color:var(--muted);background:var(--sheet)}
.mx thead a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;color:inherit;text-decoration:none}
.mx thead a b{color:var(--ink);font-weight:700}
.mx thead th.we{background:var(--sheet-2)}
.mx thead th.today{box-shadow:inset 0 -3px 0 var(--accent)}
.mx thead th.has-issue b{color:var(--bad)}
.mx thead th.locked a::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--muted)}
.mx td{cursor:pointer}
.mx td.c-on{background:var(--accent-soft);color:var(--tag-ink)}
.mx td.c-night{background:var(--night);color:var(--night-ink)}
.mx td.c-dbl{background:var(--warn-soft);color:var(--warn)}
.mx td.c-tri{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.mx td.c-away{background:repeating-linear-gradient(135deg,var(--away) 0 5px,var(--sheet) 5px 9px);color:var(--away-ink);font-weight:400}
.mx td.c-bad{outline:2px solid var(--bad);outline-offset:-3px}
.mx td.c-rest{color:var(--ok);font-weight:400}
.mx td.c-rest.kept{background:var(--ok-soft);font-weight:700;box-shadow:inset 0 0 0 1px var(--ok)}
.tg-rest{grid-column:1 / -1}
.tg-rest .tags{gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:3px;display:inline-grid;place-items:center;font:700 10px/1 var(--f-mono)}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font:700 12px/1.2 var(--f-display);font-stretch:75%;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl td.w{color:var(--warn);font-weight:700}.tbl td.b{color:var(--bad);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--sheet);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font:800 26px/1 var(--f-display);font-stretch:75%}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}

/* pilots + setup */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 14px}
.li+.li{border-top:1px solid var(--line)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.awayform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.blk{display:grid;grid-template-columns:28px repeat(2,minmax(62px,78px)) auto minmax(0,1fr) auto;gap:8px 12px;align-items:end;padding:10px 14px}
.blk-chks{display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.blk+.blk{border-top:1px solid var(--line)}
.blk-n{font-size:24px;line-height:40px;color:var(--muted)}
.blk-info{font-size:13px;color:var(--muted);line-height:1.3;padding-bottom:4px;min-width:0}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .ok{color:var(--ok)}.checks .no{color:var(--bad)}
.section{display:flex;flex-direction:column;gap:12px}
.section>h2{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.bs{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:min(82vh,720px);display:flex;flex-direction:column;background:var(--sheet);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.bs{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:520px;border-radius:12px}}
.bs-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.bs-head h2{margin:0;font-size:22px;line-height:1.05}
.bs-head p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.bs-body{overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.bs-group{margin:10px 0 2px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);text-align:left;cursor:pointer}
.pick:hover{border-color:var(--ink)}
.pick.cur{border-color:var(--accent);background:var(--accent-soft)}
.pick[disabled]{cursor:not-allowed;opacity:.6}
.pick-info{font-size:13px;color:var(--muted);min-width:0}
.bs-foot{padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.toast{position:fixed;left:50%;width:max-content;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 12px 10px 16px;border-radius:8px;background:var(--ink);color:var(--sheet);font:700 14px/1.3 var(--f-ui);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.has-sheet .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.toast button{border:0;background:transparent;color:var(--sheet);font:700 14px/1 var(--f-ui);text-decoration:underline;cursor:pointer;padding:6px}

/* loading + onboarding */
.load{padding:28px 16px;text-align:center;color:var(--muted)}
.load b{display:block;font-size:20px;color:var(--ink);margin-bottom:4px}
.ob h1{margin:0;font-size:34px;line-height:1}
.ob p{margin:0;max-width:60ch}

@media (max-width:560px){.brand-sub{display:none}}
@media (max-width:540px){
  .blk{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr);grid-template-areas:"n s e" "n c c" ". i i" ". x x"}
  .blk-n{grid-area:n}.f-s{grid-area:s}.f-e{grid-area:e}.f-c{grid-area:c}.blk-info{grid-area:i}.blk-x{grid-area:x;justify-self:start}
  .blk .inp-time{width:100%}
}
@media (max-width:420px){
  .dayhead h1{font-size:29px}
  .monthhead h1{font-size:24px}
  .tag{padding:0 7px;font-size:12.5px}
  .bill-row{padding:12px}

}
@media (prefers-reduced-motion:no-preference){
  .bs.bs-in{animation:rise .18s ease-out}
  @media (min-width:700px){.bs.bs-in{animation:none}}
  @keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}

<div id="app"></div>
<script>
/* ENGINE — rotation + watch-bill logic for one squadron that shares the alert with another.
   S = { pilots:[{id,cs,lead,active}], away:[{id,pilot,type,from,to}],
         blocks:[{s,e,late,early}],   // watch start/end ("HHMM"); may that pair enter late / leave early
         cfg:{start,minAt,nightFrom,nightTo,lateIn,earlyOut,maxLate,maxEarly,cycle,anchor,extra:[],skip:[]},
         months:{ 'YYYY-MM': { days:{ 'YYYY-MM-DD': { w:[{s,e,late,early,in:[t,t],out:[t,t],p:[id|null,id|null]}], lock } } } } }
   in/out are each pilot's own report and leave time. Older days carry one r/l per pair instead.
   Every duty day a pilot is not on alert is a rest day. Planned rests (pilots kept off alert on
   a day) are kept by date: months[ym].rest[date] = [ids] with months[ym].restFix[date] = true.
   Lists without restFix were written by an older version and are ignored.
   The squadron is on duty every `cycle` days counted from `anchor` (2 = day on, day off with
   the other squadron); `extra` and `skip` hold swapped days. "Back-to-back" means working two
   of the squadron's duty days in a row. */
const Eng = (() => {
  'use strict';
  const pad = n => String(n).padStart(2, '0');
  // Cost weights for the watch assignment (tuned by simulation)
  const W = { h: 0.5, n: 1.5, same: 8, pair: 3, lead: 1e6, nul: 1000, light: 12, lightShare: 0.8 };

  // ---- time of day ("HHMM", relative to shift change) ----
  function toMin(t) {
    if (typeof t !== 'string' || !/^\d{4}$/.test(t)) return NaN;
    const h = +t.slice(0, 2), m = +t.slice(2);
    return h > 23 || m > 59 ? NaN : h * 60 + m;
  }
  const hhmm = m => { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + pad(m % 60); };
  const rel = (t, start) => (toMin(t) - toMin(start) + 1440) % 1440;
  const ov = (a1, a2, b1, b2) => Math.max(0, Math.min(a2, b2) - Math.max(a1, b1));
  const endRel = (t, start) => { const v = rel(t, start); return v === 0 ? 1440 : v; };

  const lateT = cfg => cfg.lateIn || '1800', earlyT = cfg => cfg.earlyOut || '2200';
  const capLate = cfg => cfg.maxLate == null ? 3 : Math.max(0, +cfg.maxLate);
  const capEarly = cfg => cfg.maxEarly == null ? 3 : Math.max(0, +cfg.maxEarly);
  // may this pair enter late / leave early? (older records: a pair-level r/l other than shift change)
  const lateOK = (w, cfg) => w.late != null ? !!w.late : !!(w.r && w.r !== cfg.start);
  const earlyOK = (w, cfg) => w.early != null ? !!w.early : !!(w.l && w.l !== cfg.start);
  const seatIn = (w, si, cfg) => (w.in && w.in[si]) || w.r || cfg.start;
  const seatOut = (w, si, cfg) => (w.out && w.out[si]) || w.l || cfg.start;

  function geom(b, cfg) {
    const rs = rel(b.s, cfg.start), re = endRel(b.e, cfg.start);
    let n1 = rel(cfg.nightFrom, cfg.start), n2 = rel(cfg.nightTo, cfg.start);
    if (n2 <= n1) n2 += 1440;
    const nm = (ov(rs, re, n1, n2) + ov(rs, re, n1 - 1440, n2 - 1440)) || 0;
    const late = lateOK(b, cfg), early = earlyOK(b, cfg);
    const li = rel(lateT(cfg), cfg.start), eo = endRel(earlyT(cfg), cfg.start);
    const ok = [rs, re].every(Number.isFinite) && re > rs && (!late || li <= rs) && (!early || eo >= re);
    return { rs, re, h: (re - rs) / 60, nh: nm / 60, night: nm >= 180, ok, late, early };
  }
  function seatGeom(w, si, cfg) {
    const ri = rel(seatIn(w, si, cfg), cfg.start), ro = endRel(seatOut(w, si, cfg), cfg.start);
    return { ri, ro, pres: (ro - ri) / 60, lateIn: ri > 0, earlyOut: ro < 1440 };
  }
  // pilots at the alert building through the shift: [{a, b, n}] in minutes after shift change
  function atBuilding(ws, cfg, filled) {
    const seats = [];
    ws.forEach(w => [0, 1].forEach(si => { if (filled(w, si)) seats.push(seatGeom(w, si, cfg)); }));
    const pts = new Set([0, 1440]); seats.forEach(g => { pts.add(g.ri); pts.add(g.ro); });
    const xs = [...pts].filter(Number.isFinite).sort((a, b) => a - b), segs = [];
    for (let i = 0; i < xs.length - 1; i++) {
      const a = xs[i], b = xs[i + 1];
      const n = seats.filter(g => g.ri <= a && a < g.ro).length;
      const last = segs[segs.length - 1];
      if (last && last.n === n) last.b = b; else segs.push({ a, b, n });
    }
    return segs;
  }
  const minAtBuilding = (ws, cfg, filled) => Math.min(...atBuilding(ws, cfg, filled).map(s => s.n));

  // ---- calendar dates ("YYYY-MM-DD", UTC arithmetic) ----
  const pd = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const fd = dt => dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate());
  const addDays = (ds, n) => { const dt = pd(ds); dt.setUTCDate(dt.getUTCDate() + n); return fd(dt); };
  const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
  const dow = ds => pd(ds).getUTCDay();
  function monthDays(ym) {
    const [y, m] = ym.split('-').map(Number);
    const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return Array.from({ length: n }, (_, i) => ym + '-' + pad(i + 1));
  }
  function addMonths(ym, n) {
    const [y, m] = ym.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1 + n, 1));
    return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1);
  }

  // ---- the squadron's duty days ----
  const cycleOf = S => Math.max(1, Math.min(7, +S.cfg.cycle || 2));
  function isDuty(S, ds) {
    const c = S.cfg;
    if (c.skip && c.skip.includes(ds)) return false;
    if (c.extra && c.extra.includes(ds)) return true;
    if (!c.anchor) return true;
    const k = cycleOf(S);
    return ((diffDays(c.anchor, ds) % k) + k) % k === 0;
  }
  function stepDuty(S, ds, dir) {
    if (!ds) return null;
    let d = ds;
    for (let i = 0; i < 31; i++) { d = addDays(d, dir); if (isDuty(S, d)) return d; }
    return null;
  }
  const prevDuty = (S, ds) => stepDuty(S, ds, -1);
  const nextDuty = (S, ds) => stepDuty(S, ds, 1);
  const dutyDays = (S, from, to) => { const out = []; for (let d = from; d <= to; d = addDays(d, 1)) if (isDuty(S, d)) out.push(d); return out; };

  // ---- state access ----
  function getDay(S, ds) { if (!ds) return null; const m = S.months[ds.slice(0, 7)]; return (m && m.days && m.days[ds]) || null; }
  function setDay(S, ds, day) {
    const k = ds.slice(0, 7);
    if (!S.months[k]) S.months[k] = { days: {} };
    if (!S.months[k].days) S.months[k].days = {};
    if (day) S.months[k].days[ds] = day; else delete S.months[k].days[ds];
  }
  function onIds(S, ds) {
    const d = getDay(S, ds), set = new Set();
    if (d) d.w.forEach(w => w.p.forEach(id => { if (id) set.add(id); }));
    return set;
  }
  const awayOn = (S, pid, ds) => S.away.find(a => a.pilot === pid && a.from <= ds && ds <= a.to) || null;
  const restFrom = ds => addDays(ds, -2);   // older data kept rest lists on the shift two days before
  // pilots kept off alert on ds (planned rest)
  function getRest(S, ds) {
    const m = S.months[ds.slice(0, 7)];
    return m && m.restFix && m.restFix[ds] && m.rest && m.rest[ds] ? m.rest[ds].slice() : [];
  }
  function setRest(S, ds, ids, fixed) {
    const k = ds.slice(0, 7);
    if (!S.months[k]) S.months[k] = { days: {} };
    const m = S.months[k];
    m.rest = m.rest || {}; m.restFix = m.restFix || {};
    if (ids && ids.length) m.rest[ds] = [...new Set(ids)]; else delete m.rest[ds];
    if (fixed) m.restFix[ds] = true;
    const old = getDay(S, restFrom(ds)); if (old && old.rest) delete old.rest;
  }
  const restFixed = (S, ds) => { const m = S.months[ds.slice(0, 7)]; return !!(m && m.restFix && m.restFix[ds]); };
  const restOn = (S, pid, ds) => getRest(S, ds).includes(pid);
  // planned duty days off alert in a row around ds; next = the next planned duty day on alert
  function offRun(S, pid, ds) {
    const off = d => !!d && !!getDay(S, d) && !onIds(S, d).has(pid) && !awayOn(S, pid, d);
    let a = ds, b = ds, n = 1, at = 1, next = null, d = prevDuty(S, ds), k = 0;
    for (; off(d) && k < 60; d = prevDuty(S, d), k++) { a = d; n++; at++; }
    for (d = nextDuty(S, ds), k = 0; off(d) && k < 60; d = nextDuty(S, d), k++) { b = d; n++; }
    if (d && getDay(S, d) && onIds(S, d).has(pid)) next = d;
    return { from: a, to: b, n, at, next };
  }
  const freeOn = (S, p, ds) => p.active !== false && !awayOn(S, p.id, ds) && !restOn(S, p.id, ds);
  const leadSet = S => new Set(S.pilots.filter(p => p.lead && p.active !== false).map(p => p.id));
  const pilot = (S, id) => S.pilots.find(p => p.id === id) || null;
  // Two non-leads may not stand a watch together (only enforced once leads are marked).
  function pairOk(S, a, b) {
    const L = leadSet(S);
    if (!L.size || !a || !b) return true;
    return L.has(a) || L.has(b);
  }
  // how many duty days in a row this pilot works if put on `ds` (previous and following ones)
  function runAround(S, ds, id, lockedOnly) {
    let back = 0, d = ds;
    while (back < 3) { d = prevDuty(S, d); if (!d || !onIds(S, d).has(id)) break; back++; }
    let fwd = 0; d = ds;
    while (fwd < 3) {
      d = nextDuty(S, d); const day = getDay(S, d);
      if (!day || (lockedOnly && !day.lock) || !onIds(S, d).has(id)) break; fwd++;
    }
    return { back, fwd, run: 1 + back + fwd };
  }

  // ---- per-pilot statistics over the duty days in [from, to] ----
  function stats(S, from, to) {
    const st = {};
    S.pilots.forEach(p => {
      st[p.id] = { avail: 0, duties: 0, doubles: 0, triples: 0, hours: 0, nightH: 0, nights: 0,
        presH: 0, lateN: 0, earlyN: 0, restN: 0, rested: 0, away: 0, last: null, lastRs: null, pairs: {} };
    });
    const days = dutyDays(S, from, to);

    let prev = onIds(S, prevDuty(S, from)), prev2 = onIds(S, prevDuty(S, prevDuty(S, from)));
    if (days.length && days[0] !== from) { /* from is not a duty day: prev already points before it */ }
    days.forEach(ds => {
      const day = getDay(S, ds), on = new Set();
      if (day) day.w.forEach(w => {
        const g = geom(w, S.cfg);
        w.p.forEach((id, si) => {
          const x = st[id]; if (!x) return;
          on.add(id);
          const sg = seatGeom(w, si, S.cfg);
          x.duties++; x.hours += g.h; x.nightH += g.nh; x.presH += sg.pres;
          if (g.night) x.nights++;
          if (sg.lateIn) x.lateN++;
          if (sg.earlyOut) x.earlyN++;
          x.last = ds; x.lastRs = g.rs;
          if (prev.has(id)) { x.doubles++; if (prev2.has(id)) x.triples++; }
        });
        const [a, b] = w.p;
        if (a && b && st[a] && st[b]) {
          st[a].pairs[b] = (st[a].pairs[b] || 0) + 1;
          st[b].pairs[a] = (st[b].pairs[a] || 0) + 1;
        }
      });
      S.pilots.forEach(p => {
        if (awayOn(S, p.id, ds)) st[p.id].away++;
        else if (restOn(S, p.id, ds)) st[p.id].rested++;
        else if (p.active !== false) st[p.id].avail++;
        if (day && p.active !== false && !awayOn(S, p.id, ds) && !on.has(p.id)) st[p.id].restN++; // a rest day
      });
      prev2 = prev; prev = on;
    });
    return st;
  }

  // ---- who is on: rested pilots first, back-to-back duty days spread fairly ----
  function pickCrew(S, ds, st) {
    const need = S.blocks.length * 2, k = cycleOf(S);
    const p1 = prevDuty(S, ds), p2 = prevDuty(S, p1);
    const d1 = nextDuty(S, ds), d2 = nextDuty(S, d1);
    const y1 = onIds(S, p1), y2 = onIds(S, p2);
    const n1 = getDay(S, d1), n2 = getDay(S, d2);
    const t1 = n1 && n1.lock ? onIds(S, d1) : new Set();
    const t2 = n1 && n1.lock && n2 && n2.lock ? onIds(S, d2) : new Set();
    const avail = S.pilots.filter(p => freeOn(S, p, ds));
    const scored = avail.map((p, i) => {
      const back = y1.has(p.id) ? (y2.has(p.id) ? 2 : 1) : 0;
      const fwd = t1.has(p.id) ? (t2.has(p.id) ? 2 : 1) : 0;
      const run = 1 + back + fwd;
      const x = st[p.id], av = Math.max(x.avail, 1);
      const rest = x.last ? Math.min(Math.round(diffDays(x.last, ds) / k), 4) : 4;
      let sc = run === 1 ? 0 : run === 2 ? 100 : 1000 * (run - 2);
      if (run >= 2) sc += 300 * x.doubles / av;
      sc += 20 * x.duties / av - 3 * rest + i * 0.001;
      return { id: p.id, sc };
    }).sort((a, b) => a.sc - b.sc);
    // Flight leads (when marked) rotate as their own pool: one per pair, rested leads first;
    // the other seats come from everyone else.
    const leads = leadSet(S);
    let crew, rest;
    if (leads.size) {
      const lp = scored.filter(s => leads.has(s.id)).slice(0, S.blocks.length); // a lead may work a third day in a row
      const others = scored.filter(s => !lp.includes(s));
      crew = lp.concat(others.slice(0, need - lp.length)).sort((a, b) => a.sc - b.sc);
      rest = others.slice(need - lp.length);
    } else {
      crew = scored.slice(0, need); rest = scored.slice(need);
    }
    const swapIn = (outPred, inPred) => {
      for (let j = crew.length - 1; j >= 0; j--) {
        if (!outPred(crew[j].id)) continue;
        const q = rest.findIndex(s => inPred(s.id) && s.sc < 1000);
        if (q < 0) return false;
        const [inn] = rest.splice(q, 1); rest.push(crew[j]); crew[j] = inn;
        return true;
      }
      return false;
    };
    // The duty day after next is locked and the next one is not: leave enough people free
    // for the next one, or it can only be filled with third duty days in a row.
    if (n2 && n2.lock && !(n1 && n1.lock)) {
      const c2 = onIds(S, d2);
      const free1 = S.pilots.filter(p => freeOn(S, p, d1)).length;
      const maxOv = Math.max(0, free1 - need);
      let o = crew.filter(s => c2.has(s.id)).length, guard = 0;
      while (o > maxOv && guard++ < need && swapIn(id => c2.has(id), id => !c2.has(id))) o--;
    }
    return crew.map(s => s.id);
  }

  // ---- pairs and watches: lowest-cost split of the crew across the watch blocks ----
  function assign(S, ds, crew, st) {
    const B = S.blocks.map(b => ({ b, g: geom(b, S.cfg) }));
    const nb = B.length, n = nb * 2;
    if (!nb) return [];
    const ids = crew.slice(0, n); while (ids.length < n) ids.push(null);
    const real = ids.filter(Boolean);
    const y1 = onIds(S, prevDuty(S, ds));
    // Fair share per shift worked: someone who has worked more shifts is expected to carry
    // proportionally more watch hours, night hours and time at the building.
    const all = Object.values(st), tot = k => all.reduce((s, x) => s + x[k], 0);
    const dsum = Math.max(tot('duties'), 1);
    const rH = tot('hours') / dsum, rN = tot('nightH') / dsum;
    const dev = (x, k, r) => x[k] - x.duties * r;
    const leads = leadSet(S), useLead = real.some(id => leads.has(id));
    const order = id => {
      if (!id) return 1e9;
      const i = S.pilots.findIndex(p => p.id === id);
      return (leads.has(id) ? -1000 : 0) + i;
    };
    // per pilot x block cost, shifted so the minimum is 0 (keeps pruning valid)
    const cost = ids.map(id => {
      const light = !!(id && (pilot(S, id) || {}).light);
      const row = B.map(({ g }) => {
        if (!id) return 0;
        const x = st[id];
        let c = W.h * dev(x, 'hours', rH * (light ? W.lightShare : 1)) * g.h + W.n * dev(x, 'nightH', rN) * g.nh;
        if (light) c += W.light * g.h; // fewer watch hours: the shortest watches
        if (x.lastRs === g.rs) c += W.same;
        return c;
      });
      const m = Math.min(...row);
      return row.map(c => c - m);
    });
    const pairCost = (a, b) => {
      if (!a || !b) return 0;
      const k = st[a].pairs[b] || 0;
      let c = W.pair * k * k;

}

// Groups the crew by when they come in and when they go home.
function timeGroups(ds, day) {

    if (!id) return;
    const r = sIn(w, si), l = sOut(w, si);

  const out = [], capL = E.capLate(S.cfg), capE = E.capEarly(S.cfg);
  byTime(late).forEach(t => out.push({ label: 'Enters late at night · ' + t + ' · ' + late[t].length + ' of max ' + capL, ids: late[t] }));
  if (!Object.keys(late).length) out.push({ label: 'Enters late at night · max ' + capL, ids: [] });
  byTime(early).forEach(t => out.push({ label: 'Leaves at ' + t + ' · ' + nxTxt + ' · ' + early[t].length + ' of max ' + capE, ids: early[t] }));
  if (!Object.keys(early).length) out.push({ label: 'Leaves at ' + E.earlyT(S.cfg) + ' · max ' + capE, ids: [] });

      ids: planned ? crew.filter(id => !ndOn.has(id)) : crew.filter(id => E.restOn(S, id, nd)), again: planned ? crew.filter(id => ndOn.has(id)) : [], unplanned: !planned });
  }
  return out;
}

      else if (d && p.active !== false) { const k = E.restOn(S, p.id, ds); h += '<td class="c-rest' + (k ? ' kept' : '') + '" data-act="cell" data-ds="' + ds + '" title="' + esc(p.cs) + ' · ' + fmtDay(ds) + ' · rest day' + (k ? ', kept off alert' : '') + '">R</td>'; }

    '<span><i class="sw" style="background:var(--warn-soft);color:var(--warn)">3</i>Back-to-back (also on the last duty day)</span><span><i class="sw" style="background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 -2px 0 var(--warn)">4</i>Third duty day in a row</span>' +

    pilots.map(p => { const x = st[p.id]; return '<tr><td class="mono">' + esc(p.cs) + (p.role ? ' <span class="role">' + esc(p.role) + '</span>' : '') + (p.light ? ' <span class="flag flag-ok" title="Fewer watch hours">LIGHT</span>' : '') + '</td><td>' + x.duties + '</td><td' + (x.doubles ? ' class="w"' : '') + '>' + x.doubles + '</td><td' + (x.triples ? ' class="w"' : '') + '>' + x.triples + '</td><td>' + fmtH(x.hours) + '</td><td>' + x.nights + '</td><td>' + x.lateN + '</td><td>' + x.earlyN + '</td><td>' + x.restN + '</td><td>' + (x.away || '') + '</td></tr>'; }).join('') +

}

function leadNote() {
  const S = A.S, L = activePilots().filter(p => p.lead).length, nb = S.blocks.length;
  if (!L) return '';
  if (L < nb) return '<p class="note" style="color:var(--bad)">Only ' + L + ' flight lead' + (L === 1 ? '' : 's') + ' for ' + nb + ' pairs: some pairs will be two non-leads. Mark more leads.</p>';
  if (L < Math.ceil(1.5 * nb)) return '<p class="note" style="color:var(--warn)">' + L + ' flight leads for ' + nb + ' pairs: the leads work most duty days, and some pairs may end up without one.</p>';
  return '<p class="note">' + L + ' flight leads for ' + nb + ' pairs.</p>';
}

// ----- sheets -----
function sheet() {
  const s = A.ui.sheet; if (!s) return '';
  let head = '', body = '', foot = '';
  if (s.type === 'pick') {
    const S = A.S, day = E.getDay(S, s.ds); if (!day) return '';
    const w = day.w[s.wi], cur = w.p[s.si];
    const nx = E.nextDuty(S, s.ds), nxDay = E.getDay(S, nx), nxOpen = !!nxDay && !nxDay.lock;
    const st = E.stats(S, s.ds.slice(0, 7) + '-01', monthEnd(s.ds));
    const where = id => { let r = null; day.w.forEach((x, i) => x.p.forEach((y, j) => { if (y === id) r = { i, j }; })); return r; };
    const row = (p, info, flag, disabled) => '<button class="pick' + (p.id === cur ? ' cur' : '') + '" data-act="seat" data-pid="' + p.id + '"' + (disabled ? ' disabled' : '') + '><span class="tag tag-sm">' + esc(p.cs) + '</span><span class="pick-info">' + info + '</span>' + (flag || '<span></span>') + '</button>';
    const free = [], onDuty = [], away = [], blocked = [], kept = [];
    activePilots().forEach(p => {
      const a = E.awayOn(S, p.id, s.ds), wh = where(p.id), n = st[p.id].duties;
      if (a) { away.push(row(p, esc(a.type), '<span class="flag flag-mute">' + awayCode(a.type) + '</span>', true)); return; }
      if (wh && s.rest) return;
      if (!wh && E.restOn(S, p.id, s.ds)) {
        const okP = E.pairOk(S, p.id, w.p[1 - s.si]);
        kept.push(row(p, okP ? 'Kept off alert today. Picking them cancels that planned rest.' : 'Kept off alert today, and a non-lead like ' + esc(cs(w.p[1 - s.si])), '<span class="flag ' + (okP ? 'flag-warn">KEPT OFF' : 'flag-bad">NO LEAD') + '</span>', !okP)); return;
      }

  if (el.id === 'cfg-us' || el.id === 'cfg-them') { const v = el.value.trim().slice(0, 12); if (!v) { el.value = S.cfg[el.id === 'cfg-us' ? 'us' : 'them']; return; } S.cfg[el.id === 'cfg-us' ? 'us' : 'them'] = v; Store.touch('config'); render(); return; }
  if (el.id === 'cfg-anchor' || el.id === 'cfg-cycle') {
    if (el.id === 'cfg-anchor') { if (!el.value) return; S.cfg.anchor = el.value; } else S.cfg.cycle = +el.value;
    S.cfg.extra = []; S.cfg.skip = []; Store.touch('config');
    const t = todayStr(), nx = isDuty(t) ? t : E.nextDuty(S, t);
    A.ui.awayMsg = nx ? { text: 'Duty days changed. Planned days on the wrong dates are replaced when you re-plan.', from: nx } : null;
    render(); return;
  }
  if (el.id === 'gen-from') { A.ui.genFrom = el.value; return; }
  if (el.id === 'restore-file' && el.files && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { A.ui.restoreText = String(fr.result || ''); A.ui.restoreErr = ''; render(); };
    fr.onerror = () => { A.ui.restoreErr = 'That file couldn’t be read.'; render(); };
    fr.readAsText(el.files[0]);
  }
});
document.addEventListener('input', e => { if (e.target.id === 'restore-ta') A.ui.restoreText = e.target.value; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && A.ui.sheet) { e.preventDefault(); closeSheet(); }
  if (e.key === 'Enter' && e.target.id === 'new-cs') { e.preventDefault(); const b = $('[data-act="add-pilot"]'); if (b) b.click(); }
});
window.addEventListener('hashchange', () => { A.ui.sheet = null; render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flushAll(); });
window.addEventListener('pagehide', () => Store.flushAll());
setInterval(() => { if (A.ready && !A.ui.sheet && route().v === 'day') { const el = document.activeElement; if (!el || el === document.body) render(); } }, 60000);

render();
Store.init();
registerSW();
})();
